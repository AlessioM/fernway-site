name: Bug report
description: Something in Fernway doesn't work, crashes or looks wrong
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for testing Fernway! Please don't paste anything private — this page is public.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen again?
      placeholder: "1. Run as the Rogue\n2. Hold the net near a river\n3. ..."
  - type: input
    id: where
    attributes:
      label: Screen or situation
      placeholder: e.g. Stage 4, snowfield, upgrades panel, portrait / landscape
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: e.g. Pixel 8 Pro, Android 16
  - type: input
    id: version
    attributes:
      label: Game version
      description: Shown on the Google Play page or in Android Settings → Apps → Fernway.
      placeholder: e.g. 0.1.0
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or anything else
      description: Drag screenshots in here.
